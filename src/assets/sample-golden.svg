<svg xmlns="http://www.w3.org/2000/svg" width="640" height="800" viewBox="0 0 640 800">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f6d7b8"/>
      <stop offset="0.45" stop-color="#eeab88"/>
      <stop offset="0.75" stop-color="#c96f6e"/>
      <stop offset="1" stop-color="#8e4f63"/>
    </linearGradient>
    <radialGradient id="sunGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fff3d6" stop-opacity="0.95"/>
      <stop offset="0.5" stop-color="#ffd9a0" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#ffd9a0" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="duneA" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a75d68"/>
      <stop offset="1" stop-color="#7c4457"/>
    </linearGradient>
    <linearGradient id="duneB" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7d4356"/>
      <stop offset="1" stop-color="#5a3247"/>
    </linearGradient>
    <linearGradient id="duneC" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#55304a"/>
      <stop offset="1" stop-color="#3a2338"/>
    </linearGradient>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="2" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.055"/></feComponentTransfer>
      <feComposite operator="over" in2="SourceGraphic"/>
    </filter>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.2"/>
    </filter>
  </defs>
  <g filter="url(#grain)">
    <rect width="640" height="800" fill="url(#sky)"/>
    <circle cx="335" cy="330" r="230" fill="url(#sunGlow)"/>
    <circle cx="335" cy="330" r="64" fill="#ffe9be"/>
    <g filter="url(#soft)">
      <path d="M0 470 C 140 420 260 500 420 462 C 520 438 590 452 640 440 L640 800 L0 800 Z" fill="url(#duneA)"/>
      <path d="M0 560 C 120 520 300 600 460 550 C 555 522 610 545 640 535 L640 800 L0 800 Z" fill="url(#duneB)"/>
      <path d="M0 670 C 180 620 340 700 500 660 C 570 643 620 655 640 650 L640 800 L0 800 Z" fill="url(#duneC)"/>
    </g>
    <g opacity="0.9">
      <path d="M318 486 c0 -26 34 -26 34 0 l-3 30 c8 4 13 10 13 20 l4 74 -10 2 -8 -64 -4 64 -11 0 -4 -64 -8 64 -10 -2 4 -74 c0 -10 5 -16 13 -20 Z" fill="#2b1a2e"/>
    </g>
    <ellipse cx="335" cy="664" rx="46" ry="7" fill="#241628" opacity="0.45"/>
  </g>
</svg>
