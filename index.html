    <style>
      /* launch splash — the mark holds the screen while the app boots,
         then fades like a native launch. Removed from the DOM by main.tsx. */
      #lm-splash {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #f5f1ea;
        opacity: 1;
        transition: opacity 0.3s ease;
      }
      #lm-splash.gone {
        opacity: 0;
        pointer-events: none;
      }
      #lm-splash img {
        width: 76px;
        height: 76px;
        animation: lm-splash-in 0.5s cubic-bezier(0.2, 0.8, 0.3, 1) both;
      }
      @keyframes lm-splash-in {
        from {
          opacity: 0;
          transform: scale(0.86);
        }
        to {
          opacity: 1;
          transform: scale(1);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        #lm-splash img {
          animation: none;
        }
      }
    </style>
