    <style>
      /* launch splash — the mark holds the screen while the app boots,
         then fades like a native launch. Removed from the DOM by main.tsx. */
      #lm-splash {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        flex-direction: column;
        gap: 20px;
        align-items: center;
        justify-content: center;
        background: #eef2f5;
        opacity: 1;
        transition: opacity 0.3s ease;
      }
      #lm-splash.gone {
        opacity: 0;
        pointer-events: none;
      }
      #lm-splash img {
        width: 96px;
        height: 96px;
        animation: lm-splash-in 0.5s cubic-bezier(0.2, 0.8, 0.3, 1) both;
      }
      #lm-splash .lm-word {
        font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', sans-serif;
        font-size: 32px;
        font-weight: 800;
        letter-spacing: -0.02em;
        line-height: 1;
        color: #17242d;
        animation: lm-splash-in 0.5s cubic-bezier(0.2, 0.8, 0.3, 1) 0.08s both;
      }
      #lm-splash .lm-word span {
        color: #0f7d92;
      }
      @keyframes lm-splash-in {
        from {
          opacity: 0;
          transform: scale(0.86);
        }
        to {
          opacity: 1;
          transform: scale(1);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        #lm-splash img,
        #lm-splash .lm-word {
          animation: none;
        }
      }
    </style>
