name: SwiftUI CI

# Builds, tests, and visually captures the native app. Reference-engine
# preservation runs separately so Swift-only changes do not regenerate and
# retain the 180-image fixture corpus.

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'LensMoodApp/**'
      - '.github/workflows/swiftui-ci.yml'
  # push runs only on main; PR branches are already covered by the
  # pull_request trigger, and running both doubled the billed macOS minutes
  push:
    branches: [main]
    paths:
      - 'LensMoodApp/**'
      - '.github/workflows/swiftui-ci.yml'

concurrency:
  group: swiftui-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# contents: write only so the run can force-push review captures to the
# throwaway ci-captures branch below — never to code branches
permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate project
        working-directory: LensMoodApp
        run: xcodegen

      - name: Build (simulator, unsigned)
        working-directory: LensMoodApp
        run: |
          set -o pipefail
          xcodebuild build \
            -project LensMood.xcodeproj \
            -scheme LensMood \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO | tee xcodebuild.log | tail -100

      - name: Test engine and product invariants
        working-directory: LensMoodApp
        run: |
          set -o pipefail
          mkdir -p ui-artifacts
          xcodebuild test \
            -project LensMood.xcodeproj \
            -scheme LensMood \
            -destination 'platform=iOS Simulator,name=iPhone 16 Pro,OS=latest' \
            -resultBundlePath ui-artifacts/LensMoodTests.xcresult \
            CODE_SIGNING_ALLOWED=NO | tee xcodetest.log | tail -120

      - name: Capture simulator product surfaces
        # success() only; booting the simulator after a failed build/test
        # burns 10x-billed macOS minutes with nothing to capture
        if: success()
        working-directory: LensMoodApp
        run: |
          mkdir -p ui-artifacts
          DEVICE_ID=$(xcrun simctl list devices available | awk '/iPhone 16 Pro \(/ { value=$(NF-1); gsub(/[()]/, "", value); print value; exit }')
          test -n "$DEVICE_ID"
          xcrun simctl boot "$DEVICE_ID" || true
          xcrun simctl bootstatus "$DEVICE_ID" -b
          APP_PATH=$(find "$HOME/Library/Developer/Xcode/DerivedData" -path '*/Build/Products/Debug-iphonesimulator/LensMood.app' -print -quit)
          test -d "$APP_PATH"
          xcrun simctl install "$DEVICE_ID" "$APP_PATH"
          for tab in cameras capture library print tape; do
            xcrun simctl terminate "$DEVICE_ID" app.lensmood.ios || true
            SIMCTL_CHILD_LENSMOOD_TAB=$tab xcrun simctl launch "$DEVICE_ID" app.lensmood.ios
            sleep 3
            xcrun simctl io "$DEVICE_ID" screenshot ui-artifacts/$tab.png
          done

      - name: Upload simulator capture
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: swiftui-ui-capture
          path: LensMoodApp/ui-artifacts/
          if-no-files-found: error
          retention-days: 7

      - name: Upload Slide 64 parity evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: slide-64-parity
          path: LensMoodApp/ui-artifacts/parity/slide-64/
          if-no-files-found: warn
          retention-days: 7

      - name: Upload Xcode logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: swiftui-xcode-logs
          path: |
            LensMoodApp/xcodebuild.log
            LensMoodApp/xcodetest.log
          retention-days: 3

      # The dev sandbox can git-fetch but cannot reach the artifact CDN, so
      # screenshots + parity evidence also land on a throwaway force-pushed
      # branch for direct review. Never contains source code.
      - name: Publish captures to ci-captures branch
        if: always()
        run: |
          set -e
          DIR=$(mktemp -d)
          if [ -d LensMoodApp/ui-artifacts ]; then
            rsync -a --exclude '*.xcresult' LensMoodApp/ui-artifacts/ "$DIR"/ || true
          fi
          [ -n "$(ls -A "$DIR" 2>/dev/null)" ] || { echo "nothing to publish"; exit 0; }
          echo "run ${{ github.run_number }} sha ${{ github.sha }} $(date -u +%FT%TZ)" > "$DIR/RUN.txt"
          cd "$DIR"
          git init -q -b ci-captures
          git config user.email "actions@users.noreply.github.com"
          git config user.name "CI Captures"
          git add -A
          git commit -q -m "captures: run ${{ github.run_number }} @ ${{ github.sha }}"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" ci-captures


