name: SwiftUI CI

# Compiles and tests the SwiftUI app and verifies the frozen reference output.
# No signing or Apple account is required.

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'LensMoodApp/**'
      - 'reference/**'
      - '.github/workflows/swiftui-ci.yml'
  push:
    paths:
      - 'LensMoodApp/**'
      - 'reference/**'
      - '.github/workflows/swiftui-ci.yml'

concurrency:
  group: swiftui-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate project
        working-directory: LensMoodApp
        run: xcodegen

      - name: Build (simulator, unsigned)
        working-directory: LensMoodApp
        run: |
          set -o pipefail
          xcodebuild build \
            -project LensMood.xcodeproj \
            -scheme LensMood \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO | tee xcodebuild.log | tail -100

      - name: Test engine and product invariants
        working-directory: LensMoodApp
        run: |
          set -o pipefail
          xcodebuild test \
            -project LensMood.xcodeproj \
            -scheme LensMood \
            -destination 'platform=iOS Simulator,name=iPhone 16 Pro,OS=latest' \
            CODE_SIGNING_ALLOWED=NO | tee xcodetest.log | tail -120

      - name: Upload Xcode logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: swiftui-xcode-logs
          path: |
            LensMoodApp/xcodebuild.log
            LensMoodApp/xcodetest.log
          retention-days: 14

  fixtures:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: lensmood-native/package-lock.json
      - name: Install reference dependencies
        working-directory: lensmood-native
        run: npm ci --legacy-peer-deps
      - name: Install pinned fixture rasterizer
        working-directory: lensmood-native
        run: npm install --no-save --legacy-peer-deps @napi-rs/canvas@1.0.2
      - name: Compile reference engine
        working-directory: reference
        run: node ../lensmood-native/node_modules/typescript/lib/tsc.js lib/engine.ts lib/styles.ts lib/scene.ts --outDir out --module commonjs --target es2020 --lib es2020,dom --noCheck
      - name: Verify golden fixtures and emit renders
        working-directory: reference
        run: NODE_PATH=../lensmood-native/node_modules FIXTURES_OUT=$GITHUB_WORKSPACE/fixture-renders node fixtures.cjs verify
      - name: Upload fixture renders and labeled grids
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: golden-fixtures
          path: |
            fixture-renders/
            reference/fixtures/*/*-grid.png
            reference/fixtures/manifest.json
          if-no-files-found: error
          retention-days: 30
